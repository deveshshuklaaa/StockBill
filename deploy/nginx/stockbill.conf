# StockBill production nginx: serves the built React app and proxies the API.
# Traffic arrives from cloudflared (TLS already ended at Cloudflare) or, for
# local checks, from http://127.0.0.1:8080.

upstream stockbill_backend {
    server backend:8000;
    keepalive 16;
}

# Scheme the user actually used: Cloudflare/cloudflared send
# X-Forwarded-Proto: https; a direct local request has none, so use $scheme.
map $http_x_forwarded_proto $stockbill_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Real client address: Cloudflare sets CF-Connecting-IP; locally fall back
# to the peer address. Django (NUM_PROXIES=1) reads the last X-Forwarded-For
# entry for login throttling, so this header is replaced, not appended.
map $http_cf_connecting_ip $stockbill_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Large JSON bodies (long invoices/purchases); the API takes no file uploads.
    client_max_body_size 20m;

    # Security headers: Django sets them on /api/ and /admin/ responses;
    # nginx adds them only in the static-file locations below (add_header
    # here would be inherited by the proxy locations and sent twice).

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://stockbill_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $stockbill_forwarded_proto;
        proxy_set_header X-Forwarded-For $stockbill_client_ip;
        proxy_set_header X-Real-IP $stockbill_client_ip;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Django admin (404 from Django unless ENABLE_DJANGO_ADMIN=true).
    location /admin/ {
        proxy_pass http://stockbill_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $stockbill_forwarded_proto;
        proxy_set_header X-Forwarded-For $stockbill_client_ip;
        proxy_set_header X-Real-IP $stockbill_client_ip;
    }

    # Django admin static files, collected into the image.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must always be re-fetched so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SPA fallback: client-side routes (/invoices/12, /reports/sales) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
