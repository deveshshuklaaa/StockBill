# StockBill production nginx: serves the built React app and proxies the API.
#
# Two listeners, so nginx knows which path a request took:
#   :80   - the Cloudflare tunnel. Reachable only by the cloudflared
#           container on the compose network (not published). Cloudflare
#           sets CF-Connecting-IP to the real client and overwrites any
#           value a client sends, so it is passed to Django unchanged.
#   :8081 - local checks / SSH port-forward, published only as
#           127.0.0.1:8080. CF-Connecting-IP is stripped here, so nobody
#           can pick their own throttle key by sending that header.
# Django trusts CF-Connecting-IP only with TRUST_CF_CONNECTING_IP=true.

upstream stockbill_backend {
    server backend:8000;
    keepalive 16;
}

# Scheme the user actually used: Cloudflare sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $stockbill_tunnel_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

log_format stockbill_tunnel '$http_cf_connecting_ip via $remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_user_agent" $request_time';

# Cloudflare tunnel (cloudflared -> http://nginx:80)
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log stockbill_tunnel;

    set $stockbill_cf_ip $http_cf_connecting_ip;
    set $stockbill_proto $stockbill_tunnel_proto;
    include /etc/nginx/stockbill/common.conf;
}

# Loopback only (docker-compose publishes 127.0.0.1:8080 -> 8081)
server {
    listen 8081;
    server_name _;

    set $stockbill_cf_ip "";          # strip: never trust it on this path
    set $stockbill_proto $scheme;
    include /etc/nginx/stockbill/common.conf;
}
