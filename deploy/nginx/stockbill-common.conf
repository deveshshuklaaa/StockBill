# Shared by both StockBill listeners (included from stockbill.conf).
# Expects $stockbill_cf_ip and $stockbill_proto to be set by the server block.

server_tokens off;
root /usr/share/nginx/html;

# Large JSON bodies (long invoices/purchases); the API takes no file uploads.
client_max_body_size 20m;

# Security headers: Django sets them on /api/ and /admin/ responses; nginx
# adds them only in the static-file locations below (add_header here would
# be inherited by the proxy locations and sent twice).

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /api/ {
    proxy_pass http://stockbill_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $stockbill_proto;
    # An empty value removes the header (loopback listener).
    proxy_set_header CF-Connecting-IP $stockbill_cf_ip;
    # Informational only: Django ignores X-Forwarded-For (NUM_PROXIES=0).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Django admin (404 from Django unless ENABLE_DJANGO_ADMIN=true).
location /admin/ {
    proxy_pass http://stockbill_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $stockbill_proto;
    proxy_set_header CF-Connecting-IP $stockbill_cf_ip;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
}

# Django admin static files, collected into the image.
location /static/ {
    alias /usr/share/nginx/static/;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# Vite's hashed bundles never change under the same name.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# index.html must always be re-fetched so a new deploy is picked up.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}

# SPA fallback: client-side routes (/invoices/12, /reports/sales) load index.html.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
